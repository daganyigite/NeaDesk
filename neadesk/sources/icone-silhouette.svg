<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 14 80 68">
  <!-- Silhouette d'une seule couleur (barre de menus Mac). COULEUR est remplacé au rendu. -->
  <mask id="trous" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <rect x="0" y="0" width="100" height="100" fill="#fff"/>
    <rect x="40" y="44" width="8" height="26" rx="4" fill="#000"/>
    <rect x="68" y="44" width="8" height="26" rx="4" fill="#000"/>
    <path d="M44 48 L72 66" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.5 7"/>
    <circle cx="58" cy="57" r="4.5" fill="#000"/>
  </mask>
  <mask id="derriere" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
    <rect x="0" y="0" width="100" height="100" fill="#fff"/>
    <rect x="30" y="36" width="56" height="42" rx="8" fill="#000" stroke="#000" stroke-width="6"/>
  </mask>
  <rect x="14" y="18" width="44" height="32" rx="7" fill="none" stroke="COULEUR" stroke-width="5" mask="url(#derriere)"/>
  <rect x="30" y="36" width="56" height="42" rx="8" fill="COULEUR" mask="url(#trous)"/>
</svg>
