# NEADESK — compilation pour toutes les plateformes (Windows, macOS, Linux, Android, iOS).
# Lancement manuel : onglet Actions → "NEADESK Toutes plateformes" → Run workflow.
name: NEADESK Toutes plateformes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "neadesk-test"

  # NEADESK : les fichiers publiés s'appellent neadesk-* au lieu de rustdesk-*.
  renommer:
    needs: [build-all]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Renommer les fichiers de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/neadesk-renommer.sh "${{ github.repository }}" "neadesk-test"
